apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: digisos-alerts
  namespace: teamdigisos
  labels:
    namespace: teamdigisos
spec:
  groups:
    - name: digisos-dev-gcp-alerts
      rules:
        - alert: soknad-api-ingen-soknader
          expr: |-
            (
              sum(increase(start_soknad_counter_total[10m])) == 0
              and
              (day_of_week() >= 1 and day_of_week() <= 5 and hour() >= 8 and hour() < 21)
            )
          annotations:
            consequence: Får ingen søknader fra brukere siste 10 minutter.
          labels:
            severity: danger
            namespace: teamdigisos
        - alert: soknad-api-ingen-soknader_sendt
          expr: |-
            (
                sum(increase(sendte_soknader_digisos_api_counter_total[10m])) == 0
                and
                (day_of_week() >= 1 and day_of_week() <= 5 and hour() >= 8 and hour() < 21)
              )
          annotations:
            consequence: Får ingen søknader fra brukere siste 10 minutter.
          labels:
            severity: danger
            namespace: teamdigisos
    - name: digisos-innsyn-api-alerts
      rules:
        - alert: innsyn-api-høyt-antall-feilkoder
          expr: sum(increase(http_server_requests_seconds_count{app="sosialhjelp-innsyn-api", namespace="teamdigisos", status!~"200|202|204|302", uri!~"^/internal/.*|^/swagger.*|^root|^/webjars/.*"}[10m])) > 250 and (day_of_week() >= 1 and day_of_week() <= 5 and hour() >= 8 and hour() < 21)
          annotations:
            consequence: Over 250 feilkoder (!(2XX|3XX)) siste 10 minutter.
          labels:
            severity: danger
            namespace: teamdigisos

    - name: digisos-wonderwall-alerts
      rules:
        # Ingen tidsvindu: innlogging må fungere også kveld og helg.
        - alert: wonderwall-ingen-friske-pods
          expr: sum by (deployment) (kube_deployment_status_replicas_available{namespace="teamdigisos", deployment=~"sosialhjelp-wonderwall|wonderwall-soknad|wonderwall-innsyn"}) < 1
          for: 5m
          annotations:
            consequence: "{{ $labels.deployment }} har ingen friske pods. Brukere kan ikke logge inn."
            action: "Sjekk pods og logger for {{ $labels.deployment }} i Nais Console. Ved feil etter utrulling: sett forrige digest i manifestet og redeploy."
          labels:
            severity: danger
            namespace: teamdigisos
        # Telles på ingress, så 5xx fra appen bak wonderwall (soknad/innsyn) teller også.
        # Fanger ikke innloggingsfeil som gir 4xx. Minst 20 forespørsler for å unngå
        # utslag ved lav trafikk. Terskelen (5 %) er et første anslag.
        - alert: wonderwall-hoy-andel-5xx
          expr: |
            (
              sum by (service) (increase(nginx_ingress_controller_requests{namespace="teamdigisos", service=~"sosialhjelp-wonderwall|wonderwall-soknad|wonderwall-innsyn", status=~"5.."}[5m]))
              /
              sum by (service) (increase(nginx_ingress_controller_requests{namespace="teamdigisos", service=~"sosialhjelp-wonderwall|wonderwall-soknad|wonderwall-innsyn"}[5m]))
            ) > 0.05
            and
            sum by (service) (increase(nginx_ingress_controller_requests{namespace="teamdigisos", service=~"sosialhjelp-wonderwall|wonderwall-soknad|wonderwall-innsyn"}[5m])) > 20
          for: 5m
          annotations:
            consequence: "Over 5 % av forespørslene til {{ $labels.service }} gir 5xx siste 5 minutter. Brukere kan ikke logge inn eller bruke tjenesten."
            action: "Sjekk logger for {{ $labels.service }} og appen bak i Nais Console."
          labels:
            severity: danger
            namespace: teamdigisos

    - name: vulnerability-alerts
      rules:
        - alert: CriticalVulnerability
          expr: nais_workload_vulnerabilities{severity="CRITICAL", workload_namespace="teamdigisos", k8s_cluster_name="dev"} > 0
          for: 10m
          annotations:
            summary: "Critical vulnerability detected in {{ $labels.workload_name }}"
            consequence: "The workload is running with one or more critical vulnerabilities."
            action: "Go to Nais Console and handle the vulnerability for {{ $labels.workload_name }}."
          labels:
            namespace: teamdigisos
            severity: critical
